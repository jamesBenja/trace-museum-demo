name: Validate live TRACE recognition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke_test.py'
      - '.github/workflows/validate-scanner.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser automation
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Test public Pages website and two actual artwork scans
        run: python scripts/smoke_test.py
