name: Cache verified museum reference images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cache_artworks.py'
      - '.github/workflows/cache-art-assets.yml'
permissions:
  contents: write
jobs:
  fetch-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Fetch museum artwork reference images
        run: python scripts/cache_artworks.py
      - name: Commit valid images when available
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artworks/*.jpg
          if git diff --staged --quiet; then
            echo 'No new reference images to commit.'
          else
            git commit -m 'Cache public-domain artwork references for same-origin scanner'
            git push
          fi
