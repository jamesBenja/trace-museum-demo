name: Validate TRACE eight-work museum adventures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trace-v1.js"
      - "trace-extra.js"
      - "trace-extra.css"
      - "scripts/test_expansion.py"
      - "trace-bonus.js"
      - "trace-bonus.css"
      - "scripts/test_bonus.py"
      - "trace-coop-v2.js"
      - "trace-coop.css"
      - "trace-v1.css"
      - "index.html"
      - "scripts/test_v1.py"
      - ".github/workflows/validate-v1.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Play through both museum adventures and six art games
        run: |
          node --check trace-v1.js
          node --check trace-coop-v2.js
          node --check trace-bonus.js
          node --check trace-extra.js
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/trace-local-http.log 2>&1 &
          TRACE_TEST_URL=http://127.0.0.1:8765/?v=14 python scripts/test_v1.py
          TRACE_TEST_URL=http://127.0.0.1:8765/?v=15 python scripts/test_bonus.py
          TRACE_TEST_URL=http://127.0.0.1:8765/?v=15 python scripts/test_expansion.py
      - name: Recheck full experience at public HTTPS address after publication
        if: github.run_attempt > 1
        run: |
          TRACE_TEST_URL=https://jamesbenja.github.io/trace-museum-demo/?v=14 python scripts/test_v1.py
          TRACE_TEST_URL=https://jamesbenja.github.io/trace-museum-demo/?v=15 python scripts/test_bonus.py
          TRACE_TEST_URL=https://jamesbenja.github.io/trace-museum-demo/?v=15 python scripts/test_expansion.py
